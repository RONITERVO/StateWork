  <rect width="600" height="360" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <rect x="100" y="100" width="400" height="160"/>
    <path d="M100 70V90 M500 70V90 M100 80H500 M70 100H90 M70 260H90 M80 100V260"/>
  </g>
  <g fill="black" font-family="sans-serif" font-size="22">
